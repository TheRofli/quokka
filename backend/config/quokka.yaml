app_name: Quokka
version: 0.1.0
refresh_interval_seconds: 5
models:
  - id: qwen3-coder-next-backup
    name: Qwen3 Coder Next Backup on 8080
    provider: wsl_llama_cpp
    modality: llm
    description: Backup coding model served through llama.cpp inside WSL.
    endpoint: http://127.0.0.1:8080
    health_url: http://127.0.0.1:8080/health
    metadata:
      family: Qwen3 Coder
      size: Next Backup
      host: 127.0.0.1
      port: 8080
      engine: llama.cpp
      tags: [code, backup]
    launch:
      managed: true
      command:
        - wsl
        - bash
        - -lc
        - /opt/llama.cpp/build/bin/llama-server -m ${QWEN3_CODER_NEXT_BACKUP_MODEL_PATH} -c {context_size} -b {batch_size} -ub {ubatch_size} --temp {temperature} --top-p {top_p} --top-k {top_k} --min-p {min_p} {cache_args} {extra_args} --host 0.0.0.0 --port 8080
      working_dir: /opt/llama.cpp
      environment:
        LLAMA_LOG_COLORS: "0"
    log_path: backend/logs/qwen3-coder-next-backup.log
    active_profile_id: balanced
    profiles:
      - id: balanced
        name: Balanced
        context_size: 16384
        batch_size: 1024
        ubatch_size: 256
        temperature: 0.2
        top_p: 0.95
        top_k: 40
        min_p: 0.05
        cache_prompt: true
        cache_reuse: 256
        cache_type_k: q8_0
        cache_type_v: q8_0
        extra_args: [--ctx-size, "16384"]
      - id: long-context
        name: Long Context
        context_size: 32768
        batch_size: 768
        ubatch_size: 192
        temperature: 0.15
        top_p: 0.92
        top_k: 50
        min_p: 0.03
        cache_prompt: true
        cache_reuse: 512
        cache_type_k: q8_0
        cache_type_v: q6_k
        extra_args: [--no-webui]
    settings:
      allow_start_stop: true
      auto_restart: false
      health_enabled: true
      health_interval_seconds: 10
      startup_grace_seconds: 20
      request_timeout_seconds: 5
      log_tail_lines: 200
      keep_alive: 15m

